<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Старый телевизор — 47 каналов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Courier New", monospace;
    background:
      radial-gradient(ellipse at 50% 40%, #4a3520 0%, #241608 55%, #0a0603 100%);
    color: #e8dcc0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .05;
    background-image:
      repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 3px);
    z-index: 1;
  }

  /* ================= КОРПУС ================= */
  .tv {
    position: relative;
    z-index: 2;
    width: min(960px, 100%);
    background:
      linear-gradient(165deg, #7a5128 0%, #5a3a18 35%, #3f2810 70%, #2c1a08 100%);
    border-radius: 40px;
    padding: 34px 34px 26px;
    box-shadow:
      inset 0 3px 0 rgba(255,215,150,.18),
      inset 0 -4px 0 rgba(0,0,0,.6),
      inset 0 0 60px rgba(0,0,0,.4),
      0 30px 60px rgba(0,0,0,.8),
      0 0 0 2px #1a0f05,
      0 0 0 6px #2a1a08;
  }

  .tv::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 40px;
    pointer-events: none;
    opacity: .3;
    background: repeating-linear-gradient(
      93deg,
      rgba(0,0,0,.4) 0 1px,
      transparent 1px 5px,
      rgba(255,200,140,.1) 5px 6px,
      transparent 6px 11px
    );
  }

  /* ================= ЭКРАН ================= */
  .screen {
    position: relative;
    background: #060402;
    border-radius: 26px / 34px;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    box-shadow:
      inset 0 0 80px rgba(0,0,0,1),
      inset 0 0 20px rgba(0,0,0,1),
      0 0 0 4px #140a02,
      0 0 0 8px #2a1a08,
      0 0 0 10px #120802,
      0 0 60px rgba(0,0,0,.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6% 8%;
    text-align: center;
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px / 34px;
    background:
      radial-gradient(ellipse at 28% 18%, rgba(255,255,255,.16) 0%, transparent 42%),
      radial-gradient(ellipse at 75% 85%, rgba(255,255,255,.06) 0%, transparent 55%);
    pointer-events: none;
    z-index: 5;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.4) 0 1px,
      transparent 1px 3px
    );
    mix-blend-mode: multiply;
    z-index: 4;
    border-radius: 26px / 34px;
  }

  .flicker {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(120, 200, 255, .04);
    animation: flick 4s infinite steps(1);
    z-index: 3;
    border-radius: 26px / 34px;
  }

  @keyframes flick {
    0%, 95%, 100% { opacity: 0; }
    96% { opacity: .5; }
    97% { opacity: .1; }
    98% { opacity: .4; }
  }

  /* ===== ТЁМНЫЙ ПЕРЕХОД ===== */
  .static {
    position: absolute;
    inset: 0;
    z-index: 6;
    border-radius: 26px / 34px;
    background:
      repeating-linear-gradient(
        0deg,
        #000 0 1px,
        #0a0a0a 1px 2px,
        #000 2px 3px,
        #1c1c1c 3px 4px,
        #000 4px 6px
      );
    opacity: 0;
    pointer-events: none;
  }

  .static.on {
    animation: staticFlash .34s steps(6);
  }

  @keyframes staticFlash {
    0%   { opacity: 0; }
    15%  { opacity: .95; }
    35%  { opacity: .55; }
    55%  { opacity: .85; }
    80%  { opacity: .35; }
    100% { opacity: 0; }
  }

  .logo {
    width: clamp(64px, 12vw, 110px);
    height: clamp(64px, 12vw, 110px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(22px, 4vw, 38px);
    font-weight: 800;
    color: #fff;
    margin-bottom: 3%;
    position: relative;
    z-index: 7;
    text-shadow: 0 0 8px rgba(255,255,255,.9);
    animation: appear .35s ease-out;
  }

  .name {
    font-size: clamp(20px, 3.4vw, 34px);
    font-weight: 700;
    letter-spacing: 2px;
    color: #cfffd0;
    text-shadow:
      0 0 8px rgba(120,255,140,.9),
      0 0 22px rgba(120,255,140,.5);
    margin-bottom: 1%;
    position: relative;
    z-index: 7;
    animation: appear .35s ease-out;
  }

  .category {
    font-size: clamp(10px, 1.4vw, 14px);
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #8fd8a3;
    opacity: .85;
    margin-bottom: 4%;
    position: relative;
    z-index: 7;
    animation: appear .35s ease-out;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .watch {
    position: relative;
    z-index: 7;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 26px;
    border-radius: 999px;
    background: linear-gradient(180deg, #d9cba8 0%, #b8a577 50%, #8a7a4e 100%);
    color: #2a1a08;
    font-family: "Courier New", monospace;
    font-weight: 800;
    font-size: clamp(12px, 1.5vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 2px solid #5a4420;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -2px 3px rgba(0,0,0,.35),
      0 4px 0 #3a2a12,
      0 6px 14px rgba(0,0,0,.6);
    transition: all .08s;
    animation: appear .35s ease-out;
    cursor: pointer;
  }

  .watch:hover {
    background: linear-gradient(180deg, #f0e2c0 0%, #ccb886 50%, #9a8a5a 100%);
  }

  .watch:active {
    transform: translateY(3px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -2px 3px rgba(0,0,0,.4),
      0 1px 0 #3a2a12,
      0 2px 6px rgba(0,0,0,.5);
  }

  .watch svg { width: 13px; height: 13px; fill: currentColor; }

  /* ================= ПАНЕЛЬ ================= */
  .panel {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 8px;
    position: relative;
    z-index: 2;
  }

  .speaker {
    flex: 1;
    height: 46px;
    border-radius: 8px;
    background:
      radial-gradient(circle at 8px 50%, #120802 3px, transparent 3.5px) 0 0/16px 100% repeat-x,
      linear-gradient(180deg, #2a1a08 0%, #140a02 100%);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,.9),
      inset 0 -1px 0 rgba(255,200,140,.1);
  }

  .controls {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    flex-shrink: 0;
  }

  .channel-window {
    width: 170px;
    background: linear-gradient(180deg, #0d0a04 0%, #1a1206 100%);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,.9),
      inset 0 -1px 0 rgba(255,200,140,.1),
      0 0 0 2px #120802,
      0 0 0 4px #2a1a08;
    text-align: center;
    position: relative;
    overflow: hidden;
    align-self: center;
  }

  .channel-window::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, transparent 45%);
    pointer-events: none;
  }

  .ch-num {
    font-size: 10px;
    letter-spacing: 4px;
    color: #ff9a3c;
    text-shadow: 0 0 6px rgba(255,140,40,.9);
    margin-bottom: 4px;
  }

  .ch-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffce6a;
    text-shadow:
      0 0 8px rgba(255,180,60,.9),
      0 0 18px rgba(255,140,40,.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity .2s;
  }

  .ch-name.swap { opacity: 0; }

  /* ================= КРУТИЛКИ ================= */
  .knob-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    user-select: none;
  }

  .knob-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    flex-shrink: 0;
  }

  .knob-base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #1a0f05 0%, #2a1a08 60%, #120802 100%);
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,.9),
      0 4px 12px rgba(0,0,0,.7);
  }

  .knob {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #f3e6c4 0%, #c9b483 35%, #8a7448 70%, #4a3418 100%);
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,.6),
      inset 0 2px 0 rgba(255,255,255,.5),
      0 6px 14px rgba(0,0,0,.7),
      0 0 0 2px #2a1a08;
    user-select: none;
  }

  .channel-knob {
    transition: transform .35s cubic-bezier(.34, 1.4, .5, 1);
    cursor: ns-resize;
  }

  .volume-knob {
    transition: transform .18s ease-out;
    cursor: grab;
  }
  .volume-knob:active { cursor: grabbing; }
  .volume-knob.dragging { transition: none; cursor: grabbing; }

  .knob::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-conic-gradient(
        from 0deg,
        rgba(0,0,0,.35) 0deg 3deg,
        transparent 3deg 12deg
      );
    -webkit-mask: radial-gradient(circle, transparent 55%, #000 58%, #000 100%);
            mask: radial-gradient(circle, transparent 55%, #000 58%, #000 100%);
  }

  .knob::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 7px;
    width: 4px;
    height: 22px;
    background: #2a1a08;
    border-radius: 2px;
    transform: translateX(-50%);
    box-shadow: 0 0 0 1px rgba(255,220,160,.25);
  }

  .knob-title {
    font-size: 9px;
    letter-spacing: 3px;
    color: #b39a72;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 0 4px rgba(255,180,60,.3);
  }

  .knob-title .val {
    color: #ffce6a;
    margin-left: 6px;
    text-shadow: 0 0 8px rgba(255,180,60,.9);
    font-weight: 700;
  }

  .vol-leds {
    display: flex;
    gap: 2px;
    margin-top: 2px;
    height: 6px;
  }

  .vol-leds span {
    width: 5px;
    height: 100%;
    border-radius: 1px;
    background: #2a1a08;
    box-shadow: inset 0 1px 1px rgba(0,0,0,.8);
    transition: background .12s, box-shadow .12s;
  }

  .vol-leds span.on {
    background: #ffce6a;
    box-shadow: 0 0 5px #ffce6a, 0 0 10px rgba(255,140,40,.7);
  }

  .vol-leds span.on.red {
    background: #ff3b1f;
    box-shadow: 0 0 6px #ff3b1f, 0 0 14px rgba(255,59,31,.9);
  }

  .power {
    position: absolute;
    top: 14px;
    right: 22px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff2a1a;
    box-shadow: 0 0 10px #ff2a1a, 0 0 20px #ff2a1a, inset 0 0 4px #7a0a00;
    z-index: 3;
    animation: blink 2.5s infinite;
  }

  @keyframes blink {
    0%, 70%, 100% { opacity: 1; }
    80% { opacity: .35; }
  }

  .fullscreen-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 20, 8, 0.95);
    border: 2px solid #8a7448;
    border-radius: 12px;
    padding: 14px 22px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: #ffce6a;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 6px 20px rgba(0,0,0,.8), 0 0 40px rgba(255,140,40,.3);
    display: none;
    animation: appear .4s ease-out;
  }

  .fullscreen-hint:hover {
    background: rgba(50, 35, 15, 0.98);
    box-shadow: 0 6px 24px rgba(0,0,0,.9), 0 0 60px rgba(255,140,40,.5);
  }

  .fullscreen-hint.show { display: block; }

  @media (max-width: 860px) {
    .tv { padding: 22px 18px 20px; border-radius: 28px; }
    .panel { flex-wrap: wrap; gap: 18px; }
    .speaker { display: none; }
    .controls { width: 100%; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center; }
    .channel-window { width: 140px; }
    .knob-wrap { width: 78px; height: 78px; }
    .knob-title { font-size: 8px; letter-spacing: 2px; }
  }

  @media (max-width: 520px) {
    .channel-window { width: 110px; font-size: 12px; }
    .ch-name { font-size: 11px; }
    .knob-wrap { width: 66px; height: 66px; }
  }
</style>
</head>

    { name: "ТНТ4 (Сибирь)",   category: "Развлечения",   url: "https://tnt4.ru/",                     color: "#fbbf24", short: "Т4С" },
    { name: "Муз-ТВ (Урал)",   category: "Музыка",        url: "https://muz-tv.ru/",                   color: "#e11d48", short: "МУЗУ" },
    { name: "Карусель (Восток)",category: "Детский",       url: "https://www.karusel-tv.ru/",           color: "#f59e0b", short: "КВ"  },
    { name: "ОТР (Сибирь)",    category: "Общий",         url: "https://otr-online.ru/live",           color: "#0d9488", short: "ОТРС" },
    { name: "ТВ Центр (Юг)",   category: "Общий",         url: "https://www.tvc.ru/live/",             color: "#1e3a5f", short: "ТВЦЮ" },
    { name: "Рен ТВ (Урал)",   category: "Общий",         url: "https://ren.tv/live",                  color: "#e11d48", short: "РЕНУ" },
    { name: "Спас (Поволжье)", category: "Религиозный",   url: "https://spastv.ru/",                   color: "#78350f", short: "СПП" },
    { name: "Мир (Сибирь)",    category: "Общий",         url: "https://mir24.tv/live",                color: "#0284c7", short: "МС"  },
    { name: "Мир 24 (Урал)",   category: "Новости",       url: "https://mir24.tv/live",                color: "#0369a1", short: "М24У" },
    { name: "Звезда (Восток)", category: "Военный",       url: "https://tvzvezda.ru/live/",            color: "#b91c1c", short: "ЗВ"  },
    { name: "Пятый канал (Юг)",category: "Общий",         url: "https://www.5-tv.ru/live/",            color: "#dc2626", short: "5Ю"  },
    { name: "Россия К (Сибирь)",category: "Культура",      url: "https://smotrim.ru/live",              color: "#7c3aed", short: "КС"  },
    { name: "Россия 24 (Восток)",category: "Новости",      url: "https://smotrim.ru/live",              color: "#1e40af", short: "24В" },
    { name: "НТВ (Урал)",      category: "Общий",         url: "https://www.ntv.ru/air/ntv",           color: "#0ea5e9", short: "НТВУ" },
    { name: "Первый канал (HD)",category: "Общий",         url: "https://www.1tv.ru/live",              color: "#ff3b1f", short: "1HD" },
    { name: "Матч ТВ (Сибирь)",category: "Спорт",         url: "https://matchtv.ru/on-air",            color: "#16a34a", short: "МС"  },
    { name: "РБК (Урал)",      category: "Новости",       url: "https://tv.rbc.ru/",                   color: "#dc2626", short: "РБКУ" },
    { name: "RT (Восток)",     category: "Новости",       url: "https://www.rt.com/on-air/",           color: "#15803d", short: "RTВ" },
    { name: "СТС (Юг)",        category: "Развлечения",   url: "https://ctc.ru/online/",               color: "#f59e0b", short: "СТСЮ" },
    { name: "Домашний (Сибирь)",category: "Развлечения",  url: "https://domashniy.ru/",                color: "#c026d3", short: "ДС"  }
  ];
  // ====================================================

  const $logo     = document.getElementById("logo");
  const $name     = document.getElementById("name");
  const $category = document.getElementById("category");
  const $watch    = document.getElementById("watch");
  const $chNum    = document.getElementById("chNum");
  const $chName   = document.getElementById("chName");
  const $knob     = document.getElementById("knob");
  const $volKnob  = document.getElementById("volKnob");
  const $volVal   = document.getElementById("volVal");
  const $volLeds  = document.getElementById("volLeds").children;
  const $static   = document.getElementById("static");
  const $screen   = document.getElementById("screen");
  const $fsHint   = document.getElementById("fsHint");
  const $tv       = document.getElementById("tv");

  // ============ КАНАЛЫ ============
  let current = 0;
  let rotation = 0;
  const STEP = 360 / channels.length;

  function renderContent(i) {
    const ch = channels[i];

    $logo.style.color = ch.color;
    $logo.style.background = ch.color + "33";
    $logo.style.border = `2px solid ${ch.color}`;
    $logo.textContent = ch.short;

    $name.textContent = ch.name;
    $category.textContent = ch.category;

    $chName.classList.add("swap");
    setTimeout(() => {
      $chNum.textContent  = "CH " + String(i + 1).padStart(2, "0") + " · UHF";
      $chName.textContent = ch.name;
      $chName.classList.remove("swap");
    }, 120);
  }

  function animateSwitch() {
    $static.classList.remove("on");
    void $static.offsetWidth;
    $static.classList.add("on");

    $screen.animate(
      [
        { filter: "brightness(0.15) contrast(1.4)" },
        { filter: "brightness(0.9) contrast(1.1)" },
        { filter: "brightness(1) contrast(1)" }
      ],
      { duration: 320, easing: "ease-out" }
    );
  }

  function changeChannel(delta) {
    current = (current + delta + channels.length) % channels.length;

    rotation += STEP * delta;
    $knob.style.transform = `rotate(${rotation}deg)`;

    renderContent(current);
    animateSwitch();
  }

  // ============ ГРОМКОСТЬ ============
  let volume = 5;
  let volRot = 0;
  const VOL_MIN = -135;
  const VOL_MAX = 135;

  let audioCtx = null;
  function playClick(vol) {
    if (vol <= 0) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.value = 1100 + Math.random() * 200;

      const peak = 0.05 * (vol / 10);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peak, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } catch (e) {}
  }

  function rotToVol(rot) { return Math.round((rot - VOL_MIN) / (VOL_MAX - VOL_MIN) * 10); }
  function volToRot(v)   { return (v / 10) * (VOL_MAX - VOL_MIN) + VOL_MIN; }

  function applyVolume(rot, vol, playSound) {
    volRot = rot;
    volume = vol;

    $volKnob.style.transform = `rotate(${rot}deg)`;
    $volVal.textContent = vol;

    for (let i = 0; i < $volLeds.length; i++) {
      const led = $volLeds[i];
      const on = i < vol;
      led.classList.toggle("on", on);
      led.classList.toggle("red", on && i >= 8);
    }

    if (playSound) playClick(vol);
  }

  applyVolume(volToRot(volume), volume, false);

  function changeVolume(delta) {
    const v = Math.max(0, Math.min(10, volume + delta));
    if (v !== volume) applyVolume(volToRot(v), v, true);
  }

  // --- Перетаскивание ручки громкости ---
  let dragging = false;
  let dragStartAngle = 0;
  let dragStartRot = 0;

  function pointerAngle(e) {
    const rect = $volKnob.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
    return Math.atan2(y, x) * 180 / Math.PI;
  }

  function onDragStart(e) {
    dragging = true;
    dragStartAngle = pointerAngle(e);
    dragStartRot = volRot;
    $volKnob.classList.add("dragging");
    e.preventDefault();
    e.stopPropagation();
  }

  function onDragMove(e) {
    if (!dragging) return;
    const ang = pointerAngle(e);
    let diff = ang - dragStartAngle;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;

    let newRot = dragStartRot + diff;
    if (newRot < VOL_MIN) newRot = VOL_MIN;
    if (newRot > VOL_MAX) newRot = VOL_MAX;

    const newVol = rotToVol(newRot);
    applyVolume(newRot, newVol, newVol !== volume);
    e.preventDefault();
  }

  function onDragEnd() {
    if (!dragging) return;
    dragging = false;
    $volKnob.classList.remove("dragging");
    applyVolume(volToRot(volume), volume, false);
  }

  $volKnob.addEventListener("mousedown", onDragStart);
  $volKnob.addEventListener("touchstart", onDragStart, { passive: false });
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("touchmove", onDragMove, { passive: false });
  document.addEventListener("mouseup", onDragEnd);
  document.addEventListener("touchend", onDragEnd);
  document.addEventListener("touchcancel", onDragEnd);

  // ============ КОЛЁСИКО МЫШИ ============
  let wheelCooldown = 0;

  function wheelDirection(e) {
    const dx = e.deltaX || 0;
    const dy = e.deltaY || 0;

    if (Math.abs(dy) >= Math.abs(dx)) {
      if (dy !== 0) return dy > 0 ? 1 : -1;
    } else {
      if (dx !== 0) return dx > 0 ? 1 : -1;
    }

    if (typeof e.wheelDelta === "number" && e.wheelDelta !== 0) {
      return e.wheelDelta > 0 ? -1 : 1;
    }
    if (typeof e.detail === "number" && e.detail !== 0) {
      return e.detail > 0 ? 1 : -1;
    }
    return 0;
  }

  $tv.addEventListener("wheel", (e) => {
    e.preventDefault();

    const now = performance.now();
    if (now - wheelCooldown < 60) return;

    const dir = wheelDirection(e);
    if (dir === 0) return;

    wheelCooldown = now;

    if (e.target.closest(".knob-block-volume")) {
      changeVolume(dir > 0 ? 1 : -1);
    } else {
      changeChannel(dir > 0 ? 1 : -1);
    }
  }, { passive: false });

  // ============ КЛАВИАТУРА ============
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown") changeChannel(1);
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") changeChannel(-1);
    else if (e.key === "+" || e.key === "=") changeVolume(1);
    else if (e.key === "-" || e.key === "_") changeVolume(-1);
  });

  // ============ ОТКРЫТИЕ ЭФИРА НА ВЕСЬ ЭКРАН ============
  function openFullscreen(channelUrl) {
    const w = window.open(
      channelUrl,
      "_blank",
      "fullscreen=yes,scrollbars=no,menubar=no,toolbar=no,location=no,status=no,resizable=yes"
    );

    if (!w) {
      alert("Браузер заблокировал новое окно. Разрешите всплывающие окна для этого сайта.");
      return;
    }

    try {
      w.moveTo(0, 0);
      w.resizeTo(screen.availWidth, screen.availHeight);
    } catch (e) {}

    setTimeout(() => {
      $fsHint.classList.add("show");
      $fsHint.dataset.url = channelUrl;
    }, 300);
  }

  $watch.addEventListener("click", () => openFullscreen(channels[current].url));

  $fsHint.addEventListener("click", () => {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
    $fsHint.classList.remove("show");
  });

  // Первый рендер
  renderContent(0);
</script>
